name: Sync to Hugging Face Hub

on:
push:
branches: [main]
workflow_dispatch:

jobs:
sync-to-hub:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repo
    uses: actions/checkout@v3
    with:
      fetch-depth: 0

  - name: Set Git identity
    run: |
      git config --global user.email "you@example.com"
      git config --global user.name "your-username"

  - name: Add HF remote with token
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    run: |
      git remote add hf https://gvrraghav:$HF_TOKEN@huggingface.co/spaces/gvrraghav/OpenAI-Chatbot-Query-App

  - name: Pull from Hugging Face (IMPORTANT)
    run: |
      git pull hf main --rebase

  - name: Push to Hugging Face
    run: |
      git push hf main
```
